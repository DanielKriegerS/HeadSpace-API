spring:
  application:
    name: HeadSpace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/headspace}
    username: ${DB_USER:headspace}
    password: ${DB_PASSWORD:headspace}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  servlet:
    session:
      cookie:
        name: ${HEADSPACE_SESSION_COOKIE_NAME:HEADSPACE_SESSION}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${HEADSPACE_SESSION_SAME_SITE:Lax}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

headspace:
  security:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
    session-cookie-name: ${HEADSPACE_SESSION_COOKIE_NAME:HEADSPACE_SESSION}
    csrf-cookie-name: ${HEADSPACE_CSRF_COOKIE_NAME:XSRF-TOKEN}
    csrf-header-name: ${HEADSPACE_CSRF_HEADER_NAME:X-XSRF-TOKEN}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-NO-CORRELATION-ID}] %logger{36} - %msg%n"
