spring:
  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
server:
  servlet:
    session:
      cookie:
        secure: false
headspace:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
    session-cookie-name: ${HEADSPACE_SESSION_COOKIE_NAME:HEADSPACE_SESSION}
    session-cookie-secure: false
    session-same-site: ${HEADSPACE_SESSION_SAME_SITE:Lax}
    csrf-cookie-name: ${HEADSPACE_CSRF_COOKIE_NAME:XSRF-TOKEN}
    csrf-header-name: ${HEADSPACE_CSRF_HEADER_NAME:X-XSRF-TOKEN}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
